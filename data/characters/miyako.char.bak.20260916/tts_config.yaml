# tts_config.yaml —— 统计生成（scripts/build_char_package.py），非手拍
# 数据源: scn/voice_map.json v2 x 2098 条都的台词（清洗后）
#
# [replace_map.ja] 语料第一人称实测: {'私': 211, 'わたし': 0, 'あたし': 0, 'うち': 16, '僕': 0, '俺': 1}
#   -> 规范式「私」；方向=把偏离转写的写法拉回训练转写一致形，TTS 对齐才稳。
# [verbal_tics] 句尾后缀实测率(按 3496 句切分): かな=1.4%, だね=0.8%, よね=0.8%, かも=0.6%, だよね=0.5%, なの=0.3%, だよ=0.3%, だろう=0.3%
#   -> 入选阈值 2%，无人达标 -> 空表。都的指纹是口语短句+低丁寧語率，
#      强加口癖属手拍，违反工单约束。
# [glossary.ja] 拉丁/数字 token 实测: ＩＤx3, ＬＩＮＧx1, Ｄx1（阈值 3 次）
#   -> 语料全用全角写法的 token，把半角输入归一回语料一致形。
# [glossary.zh / replace_map.zh] 原料区无中文语料（resx 为空壳），无法统计 -> 留空；
#   中文人格一致性由 character_card 的语气约束与 few-shot 承担。
strip_actions: true
quote_guard: true
edge_voice: ja-JP-NanamiNeural
replace_map:
  zh: {}
  ja:
    あたし: 私
    わたし: 私
glossary:
  zh: {}
  ja:
    ID: ＩＤ
    id: ＩＤ
verbal_tics: []
gptsovits:
  # 四级链①级：外部 api_v2 服务（127.0.0.1:9880），模型由服务侧持有——
  #   GPT-SoVITS 仓 _setup/tts_infer_miyako.yaml：GPT_weights_v2/miyako-e15.ckpt
  #   + SoVITS_weights_v2/miyako_e8_s3904.pth（v2 微调，数据集 1459 句/110min）
  #   启动入口：GPT-SoVITS 仓「试听miyako.bat」（api_v2.py -a 127.0.0.1 -p 9880
  #   -c _setup\tts_infer_miyako.yaml）；服务未启动时 provider 抛错走降级链。
  api_url: http://127.0.0.1:9880
  text_lang: ja              # 合成源 = text_ja（§0.4）
  text_split_method: cut5
  streaming_mode: 3          # api_v2 语义：0/1=非流式整段 2=中质量流式 3=低延迟流式（首块 SLA 优先）
  reference_audio: reference_audio/candidates/my0289.wav   # 相对包根；零沉参考 rank#1（7.01s/真面目）
  prompt_text: ありがとう。くだらない質問だけど……ごめんなさい、付き合ってね   # 参考音频转写（api_v2 必需）
  prompt_lang: ja
  candidates_meta: reference_audio/candidates.yaml
audiofile:
  root: audiofile
  clip_format: ogg
  fallback_emotion: normal
