# miyako CI（M+3.5.5）—— windows-latest，base 依赖跑 pytest 全量（含两条
# import 约束执法、test_ws_auth、test_character_isolation）；extras 作业允许
# 失败不阻断（plan.md 定案）。产品仅保证 Windows（原则 12 / A.4），不跑矩阵。
name: CI

on:
  push:
  pull_request:

jobs:
  test-base:
    name: pytest 全量（base 依赖）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装 base 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: pytest 全量
        run: python -m pytest tests/ -q --tb=short

  test-extras:
    name: pytest（extras 允许失败）
    runs-on: windows-latest
    continue-on-error: true          # plan 定案：extras 作业允许失败不阻断
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装 base + extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[asr,aec,ocr,tts_edge,memory]" --no-deps
      - name: pytest 全量（extras 在位）
        run: python -m pytest tests/ -q --tb=short
